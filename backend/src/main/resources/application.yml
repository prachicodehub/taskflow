server:
  # Hosts like Render/Railway/Heroku pass the port in PORT.
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: taskflow
  datasource:
    # Either a full DB_URL, or the parts (DB_HOST/DB_PORT/DB_NAME) as most hosting dashboards provide them.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open while JSON is being rendered.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

taskflow:
  jwt:
    # Local-dev default only. Always set JWT_SECRET (≥ 32 chars) outside your machine.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
