# Render Blueprint: Spring Boot API + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo. The frontend is deployed separately (Vercel).
services:
  - type: web
    name: taskflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        fromDatabase: { name: taskflow-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: taskflow-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: taskflow-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: taskflow-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: taskflow-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      # The deployed frontend's URL(s), comma-separated. Change it if your Vercel URL differs.
      - key: CORS_ALLOWED_ORIGINS
        value: https://taskflow-three-pearl.vercel.app

databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow
